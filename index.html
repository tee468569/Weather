<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>Weather</title>
  </head>
  <body>
    <div class="container">
      <header>
        <form id="search-form">
          <input type="search" placeholder="Enter a city.." id="city-input" />
          <input type="submit" value="Search" id="search-button" />
        </form>
      </header>
      <main>
        <h1 id="city-name">Paris</h1>
        <p class="weather-details">
          <span id="dateTime"></span> <span id="description"></span>
          <br />

          Humidity:<strong id="humidity"></strong>, Wind:
          <strong id="wind-speed"></strong>
        </p>

        <p class="temperature">
          <span id="icon"></span>

          <span class="weather-temperature" id="temp"></span>
          <span class="temperature-unit">°C</span>
        </p>
      </main>
      <div class="weather-forecast">
        <div class="forecast">
          <div class="forecast-day1">Sat</div>
          <div class="forecast-icon1">☀️</div>
          <div class="temperatures">
            <div class="forecast-temperature1"><strong>4°</strong></div>
            <div class="forecast-temperature1">-2°</div>
          </div>
        </div>

        <div class="forecast">
          <div class="forecast-day1">Sat</div>
          <div class="forecast-icon1">☀️</div>
          <div class="temperatures">
            <div class="forecast-temperature1"><strong>4°</strong></div>
            <div class="forecast-temperature1">-2°</div>
          </div>
        </div>
        <div class="forecast">
          <div class="forecast-day1">Sat</div>
          <div class="forecast-icon1">☀️</div>
          <div class="temperatures">
            <div class="forecast-temperature1"><strong>4°</strong></div>
            <div class="forecast-temperature1">-2°</div>
          </div>
        </div>
        <div class="forecast">
          <div class="forecast-day1">Sat</div>
          <div class="forecast-icon1">☀️</div>
          <div class="temperatures">
            <div class="forecast-temperature1"><strong>4°</strong></div>
            <div class="forecast-temperature1">-2°</div>
          </div>
        </div>
        <div class="forecast">
          <div class="forecast-day1">Sat</div>
          <div class="forecast-icon1">☀️</div>
          <div class="temperatures">
            <div class="forecast-temperature1"><strong>4°</strong></div>
            <div class="forecast-temperature1">-2°</div>
          </div>
        </div>
      </div>
      <footer>
        This project is coded by

        >
        and hosted on

          Netlify</a
        >
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
